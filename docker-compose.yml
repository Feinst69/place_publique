services:
  place_publique:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: place_publique
    environment:
      - PORT=5000
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - MODEL_PERSON_PATH=/app/data/final/weights_model/yolo11l.pt
      - MODEL_CAR_PATH=/app/data/final/weights_model/yolo11l.pt
      - YOLO_CONF_THRESHOLD=0.15
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./mlruns:/app/mlruns
    shm_size: "1gb"
    restart: unless-stopped

  place_publique_api_only:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: place_publique_api_only
    command: ["python", "src/backend/pipeline/run_all_wsl.py", "--no-scraping"]
    environment:
      - PORT=5000
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - MODEL_PERSON_PATH=/app/data/final/weights_model/yolo11l.pt
      - MODEL_CAR_PATH=/app/data/final/weights_model/yolo11l.pt
      - YOLO_CONF_THRESHOLD=0.15
    ports:
      - "${HOST_PORT_API_ONLY:-5001}:5000"
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./mlruns:/app/mlruns
    shm_size: "1gb"
    restart: unless-stopped
    profiles: ["api-only"]
